name: Build APK
on:
  workflow_dispatch:
env:
  APP_URL: https://ziyadalmustafa97.github.io/
  JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
  LC_ALL: C.UTF-8
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate Android project
        run: |
          set -e
          mkdir -p android/app/src/main/java/com/ziyad/dirasat android/app/src/main/res/values android/app/src/main/res/mipmap-xxxhdpi
          cd android
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'App'
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.ziyad.dirasat'
            compileSdk 34
            defaultConfig { applicationId 'com.ziyad.dirasat'; minSdk 24; targetSdk 34; versionCode 1; versionName '1.0' }
            signingConfigs { release { storeFile file('app.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
            buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
            lint { abortOnError false; checkReleaseBuilds false }
          }
          EOF
          echo "" | base64 -d > app/app.keystore
          cp ../icon-512.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
            <application android:label="@string/app_name" android:icon="@mipmap/ic_launcher" android:theme="@style/AppTheme" android:allowBackup="true">
              <activity android:name=".MainActivity" android:exported="true" android:windowSoftInputMode="adjustResize" android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout|uiMode">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources><string name="app_name">\u062F\u0631\u0627\u0633\u0627\u062A</string></resources>
          EOF
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
            <style name="AppTheme" parent="android:Theme.Material.Light.NoActionBar">
              <item name="android:windowBackground">#f1f2fa</item>
              <item name="android:statusBarColor">#3d5afe</item>
              <item name="android:navigationBarColor">#f1f2fa</item>
            </style>
          </resources>
          EOF
          cat > app/src/main/java/com/ziyad/dirasat/MainActivity.java <<'EOF'
          package com.ziyad.dirasat;

          import android.app.Activity;
          import android.content.Intent;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
            static final String URL = "__URL__";
            WebView w;

            @Override
            protected void onCreate(Bundle b) {
              super.onCreate(b);
              w = new WebView(this);
              setContentView(w);
              WebSettings s = w.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setSupportZoom(false);
              s.setTextZoom(100);
              s.setMediaPlaybackRequiresUserGesture(false);
              s.setUserAgentString(s.getUserAgentString() + " SocialApp/1.0");
              w.setOverScrollMode(View.OVER_SCROLL_NEVER);
              w.setWebChromeClient(new WebChromeClient());
              w.setWebViewClient(new WebViewClient() {
                @Override
                public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                  String h = r.getUrl().getHost();
                  if (h != null && h.endsWith("github.io")) return false;
                  try { startActivity(new Intent(Intent.ACTION_VIEW, r.getUrl())); } catch (Exception e) { }
                  return true;
                }
                @Override
                public void onReceivedError(WebView v, WebResourceRequest r, WebResourceError e) {
                  if (r.isForMainFrame()) {
                    v.loadDataWithBaseURL(null, "<meta name='viewport' content='width=device-width,initial-scale=1'><body style='font-family:sans-serif;text-align:center;padding:70px 20px;background:#f1f2fa;direction:rtl'><h2>\uD83D\uDCE1 \u0645\u0641\u064A\u0634 \u0627\u062A\u0635\u0627\u0644 \u0628\u0627\u0644\u0625\u0646\u062A\u0631\u0646\u062A</h2><p>\u0627\u062A\u0623\u0643\u062F \u0645\u0646 \u0627\u0644\u0646\u062A \u0648\u0627\u0636\u063A\u0637 \u0625\u0639\u0627\u062F\u0629 \u0627\u0644\u0645\u062D\u0627\u0648\u0644\u0629.</p><a href='" + URL + "' style='display:inline-block;margin-top:14px;padding:14px 28px;border-radius:14px;background:#3d5afe;color:#fff;text-decoration:none'>\u0625\u0639\u0627\u062F\u0629 \u0627\u0644\u0645\u062D\u0627\u0648\u0644\u0629</a>", "text/html", "UTF-8", null);
                  }
                }
              });
              if (b != null) w.restoreState(b); else w.loadUrl(URL);
            }

            @Override
            protected void onSaveInstanceState(Bundle o) {
              super.onSaveInstanceState(o);
              w.saveState(o);
            }

            @Override
            public void onBackPressed() {
              if (w.canGoBack()) w.goBack(); else super.onBackPressed();
            }
          }
          EOF
          sed -i "s|__URL__|$APP_URL|" app/src/main/java/com/ziyad/dirasat/MainActivity.java
      - name: Build APK
        working-directory: android
        run: gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Darasat-APK
          path: android/app/build/outputs/apk/release/*.apk
